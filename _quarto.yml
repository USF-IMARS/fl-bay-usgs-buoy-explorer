project:
  type: website
  output-dir: _site
  pre-render:
    - historical_highlights/generate_batch_qmds.R
  render:
    - index.qmd
    - dashboard.qmd
    - maps_dashboard.qmd
    - context_dashboard.qmd
    - cluster_dashboard.qmd
    - historical_highlights/listing.qmd
    - historical_highlights/batched_reports/*.qmd

website:
  title: "Florida Bay Buoy Explorer"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: maps_dashboard.qmd
        text: Latest Salinity & Temperature
      - href: context_dashboard.qmd
        text: Current vs Usual
      - href: historical_highlights/listing.qmd
        text: Historical Highlights
      - text: Other Analyses
        menu:
          - href: dashboard.qmd
            text: Salinity Dashboard
          - href: cluster_dashboard.qmd
            text: Station Clustering
    right:
      - icon: github
        href: https://github.com/usf-imars/fl-bay-usgs-buoy-explorer

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    code-fold: true
    message: false
    warning: false
  dashboard:
    theme: cosmo
    css: styles.css
    message: false
    warning: false

execute:
  freeze: auto
